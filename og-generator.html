<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&display=swap');

  @font-face { font-family:'GT Super'; src:url('fonts/gt/GTSuperDs-RgIt.woff2') format('woff2'); font-weight:400; font-style:italic; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    background: #1b3cff;
    color: #eef1ff;
    font-family: 'Archivo', Helvetica, Arial, sans-serif;
    overflow: hidden;
    position: relative;
  }

  .corner {
    position: absolute;
    font-weight: 900;
    letter-spacing: -0.05em;
    line-height: 0.8;
    font-size: 84px;
  }
  .tl { top: 40px; left: 56px; }
  .tc { top: 40px; left: 50%; transform: translateX(-50%); font-family: 'GT Super', Georgia, serif; font-style: italic; font-weight: 400; }
  .tr { top: 40px; right: 56px; }
  .bl { bottom: 40px; left: 56px; }
  .br { bottom: 40px; right: 56px; }

  .stage {
    position: absolute;
    left: 56px;
    top: 50%;
    transform: translateY(-50%);
  }

  .name { font-weight: 800; letter-spacing: -0.02em; font-size: 30px; margin-bottom: 14px; }

  .statement { line-height: 0.8; letter-spacing: -0.04em; }
  .statement span { display: block; }
  .l1 { font-family: 'GT Super', Georgia, serif; font-style: italic; font-weight: 400; font-size: 118px; margin-left: 64px; }
  .l2 { font-weight: 900; font-size: 132px; margin-top: -6px; }

  .now {
    margin-top: 26px; font-weight: 700; letter-spacing: -0.01em; font-size: 30px;
    display: flex; align-items: baseline; gap: 10px;
  }
  .now .lbl { font-weight: 900; text-transform: uppercase; letter-spacing: 0.04em; font-size: 19px; opacity: .7; }
  .now .link { font-weight: 900; box-shadow: inset 0 -3px 0 #eef1ff; }
</style>
</head>
<body>
  <span class="corner tl">R</span>
  <span class="corner tc">O</span>
  <span class="corner tr">B</span>
  <span class="corner bl">E</span>
  <span class="corner br">R</span>

  <div class="stage">
    <div class="name">Rober González</div>
    <div class="statement">
      <span class="l1">Software</span>
      <span class="l2">Designer</span>
    </div>
    <div class="now"><span class="lbl">Now</span> @ <span class="link">Maisa AI</span></div>
  </div>
</body>
</html>
